<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Host Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>College Event Management System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
    </nav>

</header>

<section class="registration">

    <h2>Host Login</h2>

    <form id="hostLoginForm">

        <label>Email</label>

        <input
            type="email"
            id="hostEmail"
            placeholder="Enter host email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="hostPassword"
            placeholder="Enter password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="hostLoginMessage"></p>

</section>

<footer>
    <p>© 2026 College Event Management System</p>
</footer>

<script>

const hostLoginForm =
    document.getElementById("hostLoginForm");

hostLoginForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("hostEmail").value.trim();

    const password =
        document.getElementById("hostPassword").value.trim();

    const message =
        document.getElementById("hostLoginMessage");

    if (
        email === "necn@college.com" &&
        password === "12345"
    ) {

        message.innerHTML =
            "Login successful! ✅";

        message.style.color = "green";

        setTimeout(function() {

            window.location.replace("host-dashboard.html");

        }, 500);

    } else {

        message.innerHTML =
            "Invalid email or password ❌";

        message.style.color = "red";

    }

});

</script>

</body>

</html>
